<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dungeon Dad — Recap</title>
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <img class="logo" src="assets/logo.png" alt="Dungeon Dad logo" />
      <div class="brand">
        <h1>Dungeon Dad</h1>
        <p class="tag">Party recap</p>
      </div>
      <span id="unlock-badge" class="badge unlock" hidden>Unlocked (demo)</span>
    </header>

    <div id="solo-banner" class="solo-banner" hidden>Solo dry-run — labeled demo mode</div>

    <section class="panel">
      <h2 id="end-title">Back to the Tavern</h2>
      <p id="end-blurb" class="muted"></p>
      <div class="scene" style="margin-top:0.75rem">
        <img id="end-image" src="assets/rooms/boss.png" alt="Run complete" />
        <div class="caption">Run complete</div>
      </div>
    </section>

    <section class="panel">
      <h2>Party roster</h2>
      <div class="roster" id="roster"></div>
    </section>

    <section class="panel">
      <h2>Shareable recap</h2>
      <pre class="recap-box" id="recap-text">Loading…</pre>
      <div class="row">
        <button type="button" class="btn gold" id="btn-copy">Copy recap text</button>
        <a class="btn ghost" href="index.html">New session</a>
        <a class="btn ghost" href="play.html">Back to play</a>
      </div>
    </section>
  </div>

  <script src="js/session.js"></script>
  <script src="js/party.js"></script>
  <script src="js/dungeon.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      DDUI.ensureFooter();
      DDUI.updateUnlockBadge();
      await DDDungeon.loadPacks();
      const starter = DDDungeon.getStarter();
      const active = DDSession.getActive();
      if (!active || !active.code) {
        DDUI.$('#recap-text').textContent = 'No active session. Create or join from the home page.';
        return;
      }
      const session = DDSession.read(active.code);
      if (!session) {
        DDUI.$('#recap-text').textContent = 'Session not found.';
        return;
      }

      DDUI.show(DDUI.$('#solo-banner'), !!session.solo);
      if (starter.ending) {
        DDUI.$('#end-title').textContent = starter.ending.title || 'The End';
        DDUI.$('#end-blurb').textContent = starter.ending.blurb || '';
      }
      const rooms = starter.rooms || [];
      if (rooms.length) {
        DDUI.$('#end-image').src = rooms[rooms.length - 1].image;
      }

      DDParty.renderRoster(DDUI.$('#roster'), session.party, {
        playerId: active.playerId,
        hostId: session.hostId
      });

      const recap = DDDungeon.buildRecap(session);
      DDUI.$('#recap-text').textContent = recap;

      DDUI.$('#btn-copy').addEventListener('click', async function () {
        const ok = await DDUI.copyText(recap);
        DDUI.toast(ok ? 'Recap copied — share it anywhere' : 'Copy failed — select the text manually');
      });
    })();
  </script>

  <footer class="site-footer">
    <span>Dungeon Dad</span>
    <span aria-hidden="true">·</span>
    <span>Dungeon Dad Productions</span>
  </footer>

</body>
</html>
